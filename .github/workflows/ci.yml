name: IRIS CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      ###################################################
      # Authenticate to Google Cloud
      ###################################################

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication
        run: |
          gcloud auth list

      ###################################################
      # Pull DVC data
      ###################################################

      - name: Pull DVC Artifacts
        run: |
          dvc pull -v

      ###################################################
      # Train model (optional but recommended)
      ###################################################

      - name: Train Model
        run: |
          python train.py

      ###################################################
      # Run Tests
      ###################################################

      - name: Execute Pytest
        run: |
          pytest tests -v --tb=short | tee pytest_output.txt

      ###################################################
      # Create Markdown Report
      ###################################################
      - name: Install CML
        uses: iterative/setup-cml@v2

      - name: Generate Test Report
        run: |

          mkdir -p reports

          echo "# IRIS CI Report" > reports/report.md
          echo "" >> reports/report.md

          echo "## Test Results" >> reports/report.md
          echo "" >> reports/report.md

          echo '```' >> reports/report.md
          cat pytest_output.txt >> reports/report.md
          echo '```' >> reports/report.md

          echo "" >> reports/report.md

          echo "## Model Metrics" >> reports/report.md
          echo "" >> reports/report.md

          python - <<EOF

          import json

          with open("metrics/train_metrics.json") as f:
              metrics=json.load(f)

          with open("reports/report.md","a") as r:

              r.write("| Metric | Value |\\n")
              r.write("|--------|-------|\\n")

              r.write(f"| Accuracy | {metrics['accuracy']:.4f} |\\n")
              r.write(f"| Precision | {metrics['precision']:.4f} |\\n")
              r.write(f"| Recall | {metrics['recall']:.4f} |\\n")
              r.write(f"| F1 Score | {metrics['f1_score']:.4f} |\\n")

          EOF

      ###################################################
      # Publish Report using CML
      ###################################################
        
      - name: Publish CML Report
        if: always() && github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create reports/report.md