name: CD Pipeline

on:
  push:
    branches:
      - week_7

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iris-api/iris-api:v1 \
            .

      - name: Push Docker Image
        run: |
          docker push \
            us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/iris-api/iris-api:v1

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: iris-cluster
          location: us-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/
          kubectl rollout restart deployment/iris-api
          kubectl rollout status deployment/iris-api

      - name: Apply Horizontal Pod Autoscaler
        run: |
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for LoadBalancer IP
        shell: bash
        run: |
          echo "Waiting for LoadBalancer IP..."
          until EXTERNAL_IP=$(kubectl get svc iris-api-service \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}') \
              && [ -n "$EXTERNAL_IP" ]
          do
            echo "LoadBalancer not ready yet..."
            sleep 10
          done
          echo "External IP: $EXTERNAL_IP"
          echo "EXTERNAL_IP=$EXTERNAL_IP" >> $GITHUB_ENV

      - name: Wait for API Health
        shell: bash
        run: |
          echo "Waiting for API to become healthy..."

          until curl -sf http://${{ env.EXTERNAL_IP }}/health
          do
            echo "API not ready..."
            sleep 5
          done
          echo "API is healthy."

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Run Stress Test
        shell: bash
        run: |
          echo "Running stress test against http://${{ env.EXTERNAL_IP }}/predict"

          wrk \
            -t4 \
            -c1000 \
            -d30s \
            -s post.lua \
            http://${{ env.EXTERNAL_IP }}/predict \
            | tee wrk-results.txt

      - name: Upload wrk Results
        uses: actions/upload-artifact@v4
        with:
          name: wrk-results
          path: wrk-results.txt
